name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install test and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<10" "ruff>=0.11,<1" "bandit>=1.8,<2"

      - name: Compile Python sources
        run: python -m compileall -q harness tests

      - name: Run tests
        run: python -m pytest -q

      - name: Lint with Ruff
        run: ruff check harness tests --output-format=github --target-version=py311

      - name: Check formatting with Ruff
        run: ruff format --check harness tests --target-version=py311

      - name: Run Bandit security scan
        run: bandit -r harness -lll -iii -q
