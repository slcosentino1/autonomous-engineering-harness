name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<10" "ruff>=0.11,<1" "bandit>=1.8,<2"

      - name: Compile Python sources
        run: python -m compileall -q harness tests

      - name: Run tests
        run: python -m pytest -q

      - name: Lint with Ruff
        run: ruff check harness tests --output-format=github --target-version=py311

      - name: Check formatting with Ruff
        run: ruff format --check harness tests --target-version=py311

      - name: Run Bandit security scan
        run: bandit -r harness -lll -iii -q
